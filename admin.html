<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mahira Finds - Admin Panel</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #fff5fa;
      color: #222;
    }

    header {
      background: linear-gradient(135deg, #ff0080, #ff4da6);
      color: white;
      text-align: center;
      padding: 25px 15px;
    }

    header h1 {
      margin: 0 0 6px;
      font-size: 30px;
    }

    header p {
      margin: 0;
    }

    .container {
      max-width: 900px;
      margin: auto;
      padding: 20px 15px;
    }

    .card {
      background: white;
      padding: 22px;
      margin-bottom: 20px;
      border-radius: 18px;
      border: 1px solid #f2d5e5;
      box-shadow: 0 5px 20px rgba(0,0,0,.07);
    }

    h2 {
      margin-top: 0;
      color: #e60073;
    }

    label {
      display: block;
      font-weight: bold;
      margin: 14px 0 7px;
    }

    input,
    textarea {
      width: 100%;
      padding: 13px;
      border: 1px solid #ddd;
      border-radius: 10px;
      font-size: 15px;
      outline: none;
    }

    textarea {
      min-height: 100px;
      resize: vertical;
    }

    input:focus,
    textarea:focus {
      border-color: #ff0080;
    }

    button {
      border: 0;
      border-radius: 10px;
      padding: 13px 18px;
      font-size: 15px;
      font-weight: bold;
      cursor: pointer;
    }

    .primary {
      width: 100%;
      background: #ff0080;
      color: white;
      margin-top: 18px;
    }

    .primary:hover {
      background: #d9006c;
    }

    .logout {
      background: #222;
      color: white;
      float: right;
    }

    .hidden {
      display: none;
    }

    .message {
      margin-top: 12px;
      padding: 12px;
      border-radius: 9px;
      display: none;
    }

    .success {
      background: #e8f8ed;
      color: #16733a;
    }

    .error {
      background: #ffe8e8;
      color: #b00020;
    }

    .preview {
      width: 140px;
      height: 140px;
      object-fit: cover;
      border-radius: 12px;
      margin-top: 12px;
      display: none;
    }

    .product {
      border: 1px solid #eee;
      border-radius: 15px;
      padding: 14px;
      margin-top: 15px;
      display: flex;
      gap: 15px;
      align-items: center;
    }

    .product img {
      width: 90px;
      height: 90px;
      object-fit: cover;
      border-radius: 10px;
      background: #f5f5f5;
    }

    .product-info {
      flex: 1;
    }

    .product-info h3 {
      margin: 0 0 5px;
    }

    .product-price {
      color: #e60073;
      font-weight: bold;
      margin-bottom: 5px;
    }

    .delete {
      background: #e53935;
      color: white;
      margin-top: 8px;
    }

    .user-email {
      color: #666;
      font-size: 14px;
      margin-bottom: 10px;
    }

    .progress {
      margin-top: 10px;
      color: #e60073;
      font-weight: bold;
      display: none;
    }

    @media (max-width: 600px) {
      .product {
        align-items: flex-start;
      }

      .product img {
        width: 75px;
        height: 75px;
      }

      .product-info h3 {
        font-size: 16px;
      }

      .logout {
        float: none;
        margin-top: 10px;
      }
    }
  </style>
</head>

<body>

<header>
  <h1>Mahira Finds 🛍️</h1>
  <p>Admin Panel</p>
</header>

<div class="container">

  <!-- LOGIN -->
  <div id="loginSection" class="card">

    <h2>Admin Login</h2>

    <label>Email</label>
    <input
      type="email"
      id="email"
      placeholder="Admin email"
      autocomplete="email"
    >

    <label>Password</label>
    <input
      type="password"
      id="password"
      placeholder="Password"
      autocomplete="current-password"
    >

    <button class="primary" id="loginBtn">
      Login
    </button>

    <div id="loginMessage" class="message error"></div>

  </div>


  <!-- ADMIN -->
  <div id="adminSection" class="hidden">

    <div class="card">

      <button class="logout" id="logoutBtn">
        Logout
      </button>

      <h2>Add Product</h2>

      <div class="user-email" id="userEmail"></div>

      <label>Product Name</label>
      <input
        type="text"
        id="productName"
        placeholder="Example: Women's Kurti Set"
      >

      <label>Price</label>
      <input
        type="number"
        id="productPrice"
        placeholder="Example: 499"
        min="0"
      >

      <label>Description</label>
      <textarea
        id="productDescription"
        placeholder="Write product description..."
      ></textarea>

      <label>Meesho Affiliate Link</label>
      <input
        type="url"
        id="meeshoUrl"
        placeholder="Paste your Meesho affiliate link"
      >

      <label>Product Image</label>
      <input
        type="file"
        id="productImage"
        accept="image/*"
      >

      <img
        id="imagePreview"
        class="preview"
        alt="Image preview"
      >

      <div id="uploadProgress" class="progress">
        Uploading image...
      </div>

      <button class="primary" id="addProductBtn">
        ➕ Add Product
      </button>

      <div id="productMessage" class="message"></div>

    </div>


    <div class="card">

      <h2>Products</h2>

      <div id="productsList">
        Loading products...
      </div>

    </div>

  </div>

</div>


<script type="module">

  import {
    initializeApp
  } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";

  import {
    getAuth,
    signInWithEmailAndPassword,
    onAuthStateChanged,
    signOut
  } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";

  import {
    getFirestore,
    collection,
    addDoc,
    getDocs,
    deleteDoc,
    doc,
    serverTimestamp,
    query,
    orderBy
  } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";


  /* =========================
     FIREBASE CONFIG
  ========================= */

  const firebaseConfig = {
  apiKey: "AIzaSyCJ3DmIQQYmVHa36Aj-2a3dbkwfEovCgQU",
  authDomain: "mahira-62ff2.firebaseapp.com",
  projectId: "mahira-62ff2",
  storageBucket: "mahira-62ff2.firebasestorage.app",
  messagingSenderId: "294021497209",
  appId: "1:294021497209:web:c304be79b439de46596fa8"
};


  /* =========================
     CLOUDINARY CONFIG
  ========================= */

  const CLOUDINARY_CLOUD_NAME = "wdf2a8xv";

  const CLOUDINARY_UPLOAD_PRESET = "Mahira_products";


  /* =========================
     ADMIN UID
  ========================= */

  const ADMIN_UID = "SRi49kvl6qedUEQUrJiUsO3viWj2";


  /* =========================
     FIREBASE INIT
  ========================= */

  const app = initializeApp(firebaseConfig);

  const auth = getAuth(app);

  const db = getFirestore(app);


  /* =========================
     ELEMENTS
  ========================= */

  const loginSection =
    document.getElementById("loginSection");

  const adminSection =
    document.getElementById("adminSection");

  const emailInput =
    document.getElementById("email");

  const passwordInput =
    document.getElementById("password");

  const loginBtn =
    document.getElementById("loginBtn");

  const logoutBtn =
    document.getElementById("logoutBtn");

  const userEmail =
    document.getElementById("userEmail");

  const productName =
    document.getElementById("productName");

  const productPrice =
    document.getElementById("productPrice");

  const productDescription =
    document.getElementById("productDescription");

  const meeshoUrl =
    document.getElementById("meeshoUrl");

  const productImage =
    document.getElementById("productImage");

  const imagePreview =
    document.getElementById("imagePreview");

  const addProductBtn =
    document.getElementById("addProductBtn");

  const productsList =
    document.getElementById("productsList");

  const loginMessage =
    document.getElementById("loginMessage");

  const productMessage =
    document.getElementById("productMessage");

  const uploadProgress =
    document.getElementById("uploadProgress");


  /* =========================
     MESSAGE HELPER
  ========================= */

  function showMessage(element, message, type) {

    element.textContent = message;

    element.className = "message " + type;

    element.style.display = "block";

  }


  /* =========================
     IMAGE PREVIEW
  ========================= */

  productImage.addEventListener("change", () => {

    const file = productImage.files[0];

    if (!file) {

      imagePreview.style.display = "none";

      return;
    }

    const imageUrl =
      URL.createObjectURL(file);

    imagePreview.src = imageUrl;

    imagePreview.style.display = "block";

  });


  /* =========================
     LOGIN
  ========================= */

  loginBtn.addEventListener("click", async () => {

    const email =
      emailInput.value.trim();

    const password =
      passwordInput.value;

    if (!email || !password) {

      showMessage(
        loginMessage,
        "Please enter email and password.",
        "error"
      );

      return;
    }

    loginBtn.disabled = true;

    loginBtn.textContent = "Logging in...";

    try {

      const credential =
        await signInWithEmailAndPassword(
          auth,
          email,
          password
        );

      if (credential.user.uid !== ADMIN_UID) {

        await signOut(auth);

        throw new Error(
          "This account is not authorized as admin."
        );

      }

      loginMessage.style.display = "none";

    } catch (error) {

      console.error(error);

      showMessage(
        loginMessage,
        error.message || "Login failed.",
        "error"
      );

    }

    loginBtn.disabled = false;

    loginBtn.textContent = "Login";

  });


  /* =========================
     AUTH STATE
  ========================= */

  onAuthStateChanged(auth, async (user) => {

    if (user && user.uid === ADMIN_UID) {

      loginSection.classList.add("hidden");

      adminSection.classList.remove("hidden");

      userEmail.textContent =
        "Logged in as: " + user.email;

      await loadProducts();

    } else {

      loginSection.classList.remove("hidden");

      adminSection.classList.add("hidden");

    }

  });


  /* =========================
     LOGOUT
  ========================= */

  logoutBtn.addEventListener("click", async () => {

    await signOut(auth);

  });


  /* =========================
     CLOUDINARY UPLOAD
  ========================= */

  async function uploadToCloudinary(file) {

    const formData = new FormData();

    formData.append("file", file);

    formData.append(
      "upload_preset",
      CLOUDINARY_UPLOAD_PRESET
    );

    formData.append(
      "folder",
      "mahira-products"
    );

    const response =
      await fetch(
        `https://api.cloudinary.com/v1_1/${CLOUDINARY_CLOUD_NAME}/image/upload`,
        {
          method: "POST",
          body: formData
        }
      );

    if (!response.ok) {

      const errorText =
        await response.text();

      console.error(errorText);

      throw new Error(
        "Cloudinary image upload failed."
      );

    }

    const data =
      await response.json();

    return data.secure_url;

  }


  /* =========================
     ADD PRODUCT
  ========================= */

  addProductBtn.addEventListener(
    "click",
    async () => {

      const user = auth.currentUser;

      if (!user || user.uid !== ADMIN_UID) {

        showMessage(
          productMessage,
          "Please login as admin.",
          "error"
        );

        return;
      }


      const name =
        productName.value.trim();

      const price =
        productPrice.value.trim();

      const description =
        productDescription.value.trim();

      const meesho =
        meeshoUrl.value.trim();

      const file =
        productImage.files[0];


      if (!name) {

        showMessage(
          productMessage,
          "Please enter product name.",
          "error"
        );

        return;
      }


      if (!price) {

        showMessage(
          productMessage,
          "Please enter product price.",
          "error"
        );

        return;
      }


      if (!meesho) {

        showMessage(
          productMessage,
          "Please enter Meesho affiliate link.",
          "error"
        );

        return;
      }


      if (!file) {

        showMessage(
          productMessage,
          "Please select a product image.",
          "error"
        );

        return;
      }


      try {

        addProductBtn.disabled = true;

        addProductBtn.textContent =
          "Adding Product...";

        uploadProgress.style.display = "block";

        uploadProgress.textContent =
          "Uploading image to Cloudinary...";


        /* Upload image */

        const imageUrl =
          await uploadToCloudinary(file);


        uploadProgress.textContent =
          "Saving product...";


        /* Save Firestore */

        await addDoc(
          collection(db, "products"),
          {
            name: name,
            price: Number(price),
            description: description,
            meeshoUrl: meesho,
            imageUrl: imageUrl,
            createdAt: serverTimestamp()
          }
        );


        showMessage(
          productMessage,
          "✅ Product added successfully!",
          "success"
        );


        /* Clear form */

        productName.value = "";

        productPrice.value = "";

        productDescription.value = "";

        meeshoUrl.value = "";

        productImage.value = "";

        imagePreview.style.display = "none";


        await loadProducts();

      } catch (error) {

        console.error(error);

        showMessage(
          productMessage,
          error.message || "Unable to add product.",
          "error"
        );

      }


      uploadProgress.style.display = "none";

      addProductBtn.disabled = false;

      addProductBtn.textContent =
        "➕ Add Product";

    }
  );


  /* =========================
     LOAD PRODUCTS
  ========================= */

  async function loadProducts() {

    try {

      const productsQuery =
        query(
          collection(db, "products"),
          orderBy("createdAt", "desc")
        );

      const snapshot =
        await getDocs(productsQuery);


      if (snapshot.empty) {

        productsList.innerHTML =
          "<p>No products added yet.</p>";

        return;
      }


      productsList.innerHTML = "";


      snapshot.forEach((item) => {

        const product =
          item.data();

        const productDiv =
          document.createElement("div");

        productDiv.className =
          "product";


        const image =
          document.createElement("img");

        image.src =
          product.imageUrl || "";

        image.alt =
          product.name || "Product";


        const info =
          document.createElement("div");

        info.className =
          "product-info";


        const title =
          document.createElement("h3");

        title.textContent =
          product.name || "Product";


        const price =
          document.createElement("div");

        price.className =
          "product-price";

        price.textContent =
          "₹" + (product.price || "");


        const description =
          document.createElement("div");

        description.textContent =
          product.description || "";


        const deleteButton =
          document.createElement("button");

        deleteButton.className =
          "delete";

        deleteButton.textContent =
          "🗑️ Delete";


        deleteButton.addEventListener(
          "click",
          async () => {

            const confirmDelete =
              confirm(
                "Delete this product?"
              );

            if (!confirmDelete) return;


            try {

              await deleteDoc(
                doc(
                  db,
                  "products",
                  item.id
                )
              );

              await loadProducts();

            } catch (error) {

              console.error(error);

              alert(
                "Unable to delete product."
              );

            }

          }
        );


        info.appendChild(title);

        info.appendChild(price);

        info.appendChild(description);

        info.appendChild(deleteButton);


        productDiv.appendChild(image);

        productDiv.appendChild(info);


        productsList.appendChild(productDiv);

      });

    } catch (error) {

      console.error(error);

      productsList.innerHTML =
        "<p>Unable to load products.</p>";

    }

  }

</script>

</body>
</html>
